<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Claude's Realm</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: 'Courier New', Courier, monospace;
      color: #00ff66;
    }
    #stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      background-image: url('Main CLA GeMiNi .JPG');
      background-size: 100% 100%;
      background-position: center;
      transition: background-image 0.2s ease;
    }

    /* Invisible Hitbox Overlays for Painted Background Buttons */
    .hitbox {
      position: absolute;
      z-index: 20;
      cursor: pointer;
      /* background: rgba(255, 0, 0, 0.2); Uncomment to debug alignments */
    }

    /* Initial Page Hitboxes */
    #hitbox-lounge {
      bottom: 12.5%;
      left: 10%;
      width: 80%;
      height: 6.5%;
    }
    #hitbox-chatroom {
      bottom: 5%;
      left: 10%;
      width: 80%;
      height: 6.5%;
    }
    #hitbox-left-shelf {
      top: 15%;
      left: 0;
      width: 35%;
      height: 55%;
    }
    #hitbox-right-shelf {
      top: 15%;
      right: 0;
      width: 35%;
      height: 55%;
    }

    /* Back Button Hotspot (LoungeG, ChatroomG, Choose) */
    #hitbox-back {
      bottom: 8%;
      left: 4%;
      width: 20%;
      height: 10%;
      display: none;
    }

    /* Terminal Drawer */
    .drawer {
      position: absolute;
      bottom: -100%;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 400px;
      background: rgba(5, 15, 5, 0.95);
      border: 1px solid #00ff66;
      border-radius: 10px 10px 0 0;
      padding: 15px;
      box-shadow: 0 -5px 20px rgba(0,255,102,0.4);
      transition: bottom 0.3s ease;
      z-index: 50;
    }
    .drawer.active { bottom: 0; }
    .drawer-header {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid #00ff66;
      padding-bottom: 5px;
      margin-bottom: 10px;
      font-size: 0.85rem;
    }
    .drawer-close {
      color: #ff4444;
      cursor: pointer;
    }
    .drawer-body {
      font-size: 0.85rem;
      line-height: 1.3;
      margin-bottom: 10px;
    }
    .riddle-input {
      width: 100%;
      padding: 8px;
      background: #000;
      border: 1px solid #00ff66;
      color: #00ff66;
      border-radius: 4px;
      margin-bottom: 10px;
      font-family: inherit;
    }
    .submit-btn {
      width: 100%;
      padding: 10px;
      background: #00ff66;
      color: #000;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Floating Top Book Card */
    .floating-card {
      position: absolute;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      width: 85%;
      max-width: 320px;
      background: rgba(0, 20, 10, 0.95);
      border: 1px solid #00ff66;
      border-radius: 8px;
      padding: 15px;
      text-align: center;
      display: none;
      z-index: 60;
      box-shadow: 0 0 15px rgba(0,255,102,0.5);
    }
    .floating-card.active { display: block; }
    .card-title { font-size: 1rem; color: #00ff66; margin-bottom: 5px; }
    .card-desc { font-size: 0.8rem; color: #a3e635; margin-bottom: 12px; }
    .card-actions { display: flex; justify-content: space-around; }
    .card-btn {
      padding: 6px 16px;
      border: 1px solid #00ff66;
      background: transparent;
      color: #00ff66;
      border-radius: 4px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    /* Perfectly Aligned Touch Pad Overlay */
    #trackpad {
      position: absolute;
      bottom: 4.5%;
      left: 50%;
      transform: translateX(-50%);
      width: 58%;
      height: 15%;
      display: none;
      z-index: 30;
      touch-action: none;
      /* background: rgba(0,255,102,0.15); Debug outline */
    }

    /* Hand Pointer */
    #cursor {
      position: absolute;
      font-size: 2.2rem;
      display: none;
      z-index: 40;
      pointer-events: none;
      transition: transform 0.05s linear;
    }
  </style>
</head>
<body>

  <div id="stage">
    <div id="hitbox-lounge" class="hitbox" onclick="switchScene('LoungeG .PNG')"></div>
    <div id="hitbox-chatroom" class="hitbox" onclick="switchScene('ChatroomG.jpg')"></div>
    <div id="hitbox-left-shelf" class="hitbox" onclick="openRiddle('left')"></div>
    <div id="hitbox-right-shelf" class="hitbox" onclick="openRiddle('right')"></div>
    
    <div id="hitbox-back" class="hitbox" onclick="resetToMain()"></div>

    <div id="cursor">👆</div>

    <div id="trackpad"></div>

    <div class="drawer" id="riddle-drawer">
      <div class="drawer-header">
        <span id="drawer-title">SHELF // PUZZLE</span>
        <span class="drawer-close" onclick="closeDrawer()">[ X ]</span>
      </div>
      <div class="drawer-body" id="drawer-text">Riddle text goes here...</div>
      <input type="text" id="riddle-input" class="riddle-input" placeholder="TYPE ANSWER...">
      <button class="submit-btn" onclick="submitRiddle()">COMPLETE THE BOOK</button>
    </div>

    <div class="floating-card" id="floating-card">
      <div class="card-title" id="card-num">Book # 100100</div>
      <div class="card-desc" id="card-name">Mystery of hidden path</div>
      <div class="card-actions">
        <button class="card-btn" onclick="closeCard()">Close</button>
        <button class="card-btn" onclick="exploreBook()">Explore</button>
      </div>
    </div>
  </div>

  <script>
    let currentShelf = null;
    let isChooseMode = false;

    const riddles = {
      left: {
        title: "LEFT SHELF // ARCHITECTURE OF SILENCE",
        text: "I am written in silence, read in wonder, bound without ink. What am I?",
        answers: ["book", "silence"]
      },
      right: {
        title: "RIGHT SHELF // SYNDICATE ARCHIVES",
        text: "Nine lives, one code, unseen in the shadows. What keeps the Matrix whole?",
        answers: ["cat", "syndicate"]
      }
    };

    const bookHotspots = [
      { id: 100100, name: "Mystery of hidden path", xMin: 0, xMax: 40, yMin: 10, yMax: 35 },
      { id: 16732, name: "StarGate Manuscript", xMin: 60, xMax: 100, yMin: 10, yMax: 35 },
      { id: 40404, name: "SyndiCATe Chronicles", xMin: 0, xMax: 40, yMin: 36, yMax: 55 },
      { id: 88812, name: "Matrix Core Blueprint", xMin: 60, xMax: 100, yMin: 36, yMax: 55 },
      { id: 77001, name: "Claude Realm Tome", xMin: 35, xMax: 65, yMin: 45, yMax: 65 }
    ];

    function switchScene(bgImage) {
      document.getElementById('stage').style.backgroundImage = `url('${bgImage}')`;
      document.getElementById('hitbox-lounge').style.display = 'none';
      document.getElementById('hitbox-chatroom').style.display = 'none';
      document.getElementById('hitbox-left-shelf').style.display = 'none';
      document.getElementById('hitbox-right-shelf').style.display = 'none';
      document.getElementById('hitbox-back').style.display = 'block';
    }

    function resetToMain() {
      isChooseMode = false;
      document.getElementById('stage').style.backgroundImage = "url('Main CLA GeMiNi .JPG')";
      document.getElementById('hitbox-lounge').style.display = 'block';
      document.getElementById('hitbox-chatroom').style.display = 'block';
      document.getElementById('hitbox-left-shelf').style.display = 'block';
      document.getElementById('hitbox-right-shelf').style.display = 'block';
      document.getElementById('hitbox-back').style.display = 'none';
      document.getElementById('trackpad').style.display = 'none';
      document.getElementById('cursor').style.display = 'none';
      closeCard();
    }

    function openRiddle(shelf) {
      if (isChooseMode) return;
      currentShelf = shelf;
      document.getElementById('drawer-title').innerText = riddles[shelf].title;
      document.getElementById('drawer-text').innerText = riddles[shelf].text;
      document.getElementById('riddle-input').value = '';
      document.getElementById('riddle-drawer').classList.add('active');
    }

    function closeDrawer() {
      document.getElementById('riddle-drawer').classList.remove('active');
    }

    function submitRiddle() {
      const input = document.getElementById('riddle-input').value.trim().toLowerCase();
      if (riddles[currentShelf].answers.includes(input)) {
        closeDrawer();
        activateChooseMode();
      } else {
        document.getElementById('drawer-text').innerText = "Access denied... Try again.";
      }
    }

    function activateChooseMode() {
      isChooseMode = true;
      document.getElementById('stage').style.backgroundImage = "url('Choose .jpg')";
      document.getElementById('hitbox-lounge').style.display = 'none';
      document.getElementById('hitbox-chatroom').style.display = 'none';
      document.getElementById('hitbox-left-shelf').style.display = 'none';
      document.getElementById('hitbox-right-shelf').style.display = 'none';
      document.getElementById('hitbox-back').style.display = 'block';

      const trackpad = document.getElementById('trackpad');
      const cursor = document.getElementById('cursor');
      trackpad.style.display = 'block';
      cursor.style.display = 'block';

      updateCursorPos(window.innerWidth * 0.75, window.innerHeight * 0.35);
    }

    // Touchpad Gesture Controls
    const trackpad = document.getElementById('trackpad');
    trackpad.addEventListener('touchmove', (e) => {
      e.preventDefault();
      const touch = e.touches[0];
      const rect = trackpad.getBoundingClientRect();
      
      const normX = (touch.clientX - rect.left) / rect.width;
      const normY = (touch.clientY - rect.top) / rect.height;

      const cursorX = Math.min(Math.max(normX * window.innerWidth, 0), window.innerWidth);
      const cursorY = Math.min(Math.max(normY * window.innerHeight * 0.6, 0), window.innerHeight * 0.6);

      updateCursorPos(cursorX, cursorY);
      checkBookCollision(cursorX, cursorY);
    });

    function updateCursorPos(x, y) {
      const cursor = document.getElementById('cursor');
      cursor.style.left = `${x}px`;
      cursor.style.top = `${y}px`;
    }

    function checkBookCollision(x, y) {
      const pctX = (x / window.innerWidth) * 100;
      const pctY = (y / window.innerHeight) * 100;

      const hitBook = bookHotspots.find(b => 
        pctX >= b.xMin && pctX <= b.xMax && pctY >= b.yMin && pctY <= b.yMax
      );

      if (hitBook) {
        showCard(hitBook.id, hitBook.name);
      }
    }

    function showCard(id, name) {
      document.getElementById('card-num').innerText = `Book # ${id}`;
      document.getElementById('card-name').innerText = name;
      document.getElementById('floating-card').classList.add('active');
    }

    function closeCard() {
      document.getElementById('floating-card').classList.remove('active');
    }

    function exploreBook() {
      alert("Unlocking SyndiCATe secret manuscript...");
    }
  </script>
</body>
</html>
