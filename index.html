<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Claude Realm // Library of Unwritten Books</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Courier New', Courier, monospace;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            color: #00ff66;
        }

        /* Fixed 9:16 Viewport Canvas */
        #viewport {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: url('Main CLA GeMiNi .JPG') no-repeat center center;
            background-size: cover;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }

        /* Header Overlay */
        .header-title {
            margin-top: 25px;
            font-size: 1.1rem;
            letter-spacing: 2px;
            color: #d1d5db;
            text-shadow: 0 0 8px rgba(0, 0, 0, 0.9), 0 0 4px rgba(0, 255, 102, 0.5);
            text-align: center;
            font-weight: bold;
            z-index: 10;
        }

        /* Interactive Shelf Touch Zones (Left & Right) */
        .shelf-hitbox {
            position: absolute;
            top: 15%;
            width: 28%;
            height: 45%;
            z-index: 5;
            cursor: pointer;
        }
        #shelf-left { left: 2%; }
        #shelf-right { right: 2%; }

        /* Scanning Line Animation on Tap */
        .scan-effect {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, transparent, rgba(0, 255, 102, 0.2), transparent);
            pointer-events: none;
            opacity: 0;
            z-index: 6;
        }
        .scanning {
            animation: scan 1.2s ease-in-out;
        }
        @keyframes scan {
            0% { top: -100%; opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        /* Sub-Desk UI & Controls */
        .control-container {
            width: 85%;
            max-width: 380px;
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 10;
        }

        .nav-btn {
            background: rgba(20, 25, 22, 0.85);
            border: 1px solid #4a554f;
            box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.8), 0 4px 10px rgba(0,0,0,0.7);
            color: #d1d5db;
            padding: 14px 0;
            border-radius: 8px;
            text-align: center;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 1px;
            display: block;
            transition: all 0.2s ease;
        }

        .nav-btn:active {
            background: rgba(0, 255, 102, 0.2);
            border-color: #00ff66;
            color: #fff;
            transform: scale(0.98);
        }

        .approval-footer {
            font-size: 0.65rem;
            color: #6b7280;
            text-align: center;
            letter-spacing: 1px;
            margin-top: 4px;
        }

        /* Slide-Up Terminal Drawer */
        #terminal-modal {
            position: absolute;
            bottom: -100%;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 400px;
            background: rgba(10, 15, 12, 0.95);
            border: 1px solid #00ff66;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.3);
            border-radius: 10px;
            padding: 16px;
            z-index: 20;
            transition: bottom 0.4s cubic-bezier(0.1, 0.9, 0.2, 1);
        }

        #terminal-modal.open {
            bottom: 20px;
        }

        .term-header {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #00ff66;
            padding-bottom: 6px;
            margin-bottom: 12px;
            font-size: 0.8rem;
        }

        .term-close {
            color: #ff5555;
            cursor: pointer;
        }

        .term-body {
            font-size: 0.85rem;
            line-height: 1.4;
            margin-bottom: 12px;
            color: #a3e635;
        }

        .term-input {
            width: 100%;
            background: #000;
            border: 1px solid #00ff66;
            color: #00ff66;
            padding: 10px;
            font-size: 0.85rem;
            border-radius: 4px;
            outline: none;
            margin-bottom: 8px;
        }

        .term-submit {
            width: 100%;
            background: #00ff66;
            color: #000;
            border: none;
            padding: 10px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }

        .glitch {
            animation: glitch-anim 0.2s 2;
        }

        @keyframes glitch-anim {
            0% { transform: translate(2px, -2px); }
            50% { transform: translate(-2px, 2px); }
            100% { transform: translate(0, 0); }
        }
    </style>
</head>
<body>

    <div id="viewport">
        <div id="scanner" class="scan-effect"></div>

        <div class="header-title">Welcome To Mystery Of Silence</div>

        <div id="shelf-left" class="shelf-hitbox" onclick="triggerShelf('Left Shelf')"></div>
        <div id="shelf-right" class="shelf-hitbox" onclick="triggerShelf('Right Shelf')"></div>

        <div class="control-container">
            <a href="https://cateticos-rgb.github.io/Boardroom/" class="nav-btn">&larr; &lt; Back To Lounge &gt;</a>
            <a href="https://cateticos-rgb.github.io/Boardroom/Chatroom.html" class="nav-btn">&#128172; &lt; Go To Chatroom &gt;</a>
            <div class="approval-footer">&lt; Catetic-Exchange Matrix Approved &gt;</div>
        </div>

        <div id="terminal-modal">
            <div class="term-header">
                <span id="term-title">UNWRITTEN BOOK #1</span>
                <span class="term-close" onclick="closeTerminal()">[ X ]</span>
            </div>
            <div class="term-body" id="term-text">
                Mnemosyne is mother of 9. What do you preserve?
            </div>
            <input type="text" id="puzzle-input" class="term-input" placeholder="TYPE ANSWER..." autocomplete="off">
            <button class="term-submit" onclick="verifyAnswer()">COMPLETE THE BOOK</button>
        </div>
    </div>

    <script>
        // Track local riddle state
        let currentChain = parseInt(localStorage.getItem('claude_chain') || '0');

        function triggerShelf(shelfName) {
            const scanner = document.getElementById('scanner');
            scanner.classList.remove('scanning');
            void scanner.offsetWidth; // Trigger reflow
            scanner.classList.add('scanning');

            document.getElementById('term-title').innerText = `${shelfName.toUpperCase()} // PUZZLE`;
            document.getElementById('term-text').innerText = "Mnemosyne is mother of 9. What do you preserve?";
            document.getElementById('terminal-modal').classList.add('open');
        }

        function closeTerminal() {
            document.getElementById('terminal-modal').classList.remove('open');
            document.getElementById('puzzle-input').value = '';
        }

        function verifyAnswer() {
            const input = document.getElementById('puzzle-input').value.trim().toLowerCase();
            const modal = document.getElementById('terminal-modal');

            if (input === 'memory') {
                currentChain++;
                localStorage.setItem('claude_chain', currentChain);
                document.getElementById('term-text').innerText = `[SUCCESS] Book inscribed. Chain: ${currentChain}/3`;
                setTimeout(() => {
                    closeTerminal();
                }, 1500);
            } else {
                modal.classList.add('glitch');
                document.getElementById('term-text').innerText = "Page goes blank... resets. Try again.";
                setTimeout(() => {
                    modal.classList.remove('glitch');
                }, 400);
            }
        }
    </script>
</body>
</html>
