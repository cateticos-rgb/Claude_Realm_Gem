<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Claude's Realm</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: 'Courier New', Courier, monospace;
      color: #00ff66;
    }
    #stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      background-image: url('Main CLA GeMiNi .JPG');
      background-size: cover;
      background-position: center;
      transition: background-image 0.4s ease;
    }
    .header-title {
      position: absolute;
      top: 15px;
      width: 100%;
      text-align: center;
      font-size: 1.1rem;
      font-weight: bold;
      color: #d1d5db;
      text-shadow: 0 0 8px rgba(0,255,102,0.6);
      letter-spacing: 1px;
      z-index: 10;
    }
    .shelf-hotspot {
      position: absolute;
      top: 15%;
      height: 50%;
      width: 35%;
      z-index: 5;
    }
    #shelf-left { left: 0; }
    #shelf-right { right: 0; }

    /* Nav Buttons Layer */
    .nav-container {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      width: 85%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 10;
    }
    .nav-btn {
      display: block;
      width: 100%;
      padding: 12px;
      text-align: center;
      background: rgba(10, 15, 10, 0.85);
      border: 1px solid #00ff66;
      border-radius: 8px;
      color: #00ff66;
      text-decoration: none;
      font-weight: bold;
      font-size: 0.9rem;
      box-shadow: 0 0 10px rgba(0, 255, 102, 0.2);
    }
    .nav-btn:active {
      background: #00ff66;
      color: #000;
    }

    /* Terminal Drawer */
    .drawer {
      position: absolute;
      bottom: -100%;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 400px;
      background: rgba(5, 15, 5, 0.95);
      border: 1px solid #00ff66;
      border-radius: 10px 10px 0 0;
      padding: 15px;
      box-shadow: 0 -5px 20px rgba(0,255,102,0.4);
      transition: bottom 0.3s ease;
      z-index: 50;
    }
    .drawer.active { bottom: 0; }
    .drawer-header {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid #00ff66;
      padding-bottom: 5px;
      margin-bottom: 10px;
      font-size: 0.85rem;
    }
    .drawer-close {
      color: #ff4444;
      cursor: pointer;
    }
    .drawer-body {
      font-size: 0.85rem;
      line-height: 1.3;
      margin-bottom: 10px;
    }
    .riddle-input {
      width: 100%;
      padding: 8px;
      background: #000;
      border: 1px solid #00ff66;
      color: #00ff66;
      border-radius: 4px;
      margin-bottom: 10px;
      font-family: inherit;
    }
    .submit-btn {
      width: 100%;
      padding: 10px;
      background: #00ff66;
      color: #000;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Floating Top Book Card */
    .floating-card {
      position: absolute;
      top: 50px;
      left: 50%;
      transform: translateX(-50%);
      width: 85%;
      max-width: 320px;
      background: rgba(0, 20, 10, 0.92);
      border: 1px solid #00ff66;
      border-radius: 8px;
      padding: 15px;
      text-align: center;
      display: none;
      z-index: 60;
      box-shadow: 0 0 15px rgba(0,255,102,0.5);
    }
    .floating-card.active { display: block; }
    .card-title { font-size: 1rem; color: #00ff66; margin-bottom: 5px; }
    .card-desc { font-size: 0.8rem; color: #a3e635; margin-bottom: 12px; }
    .card-actions { display: flex; justify-content: space-around; }
    .card-btn {
      padding: 6px 16px;
      border: 1px solid #00ff66;
      background: transparent;
      color: #00ff66;
      border-radius: 4px;
      font-size: 0.8rem;
    }

    /* Trackpad Overlay (Choose Mode) */
    #trackpad {
      position: absolute;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      width: 220px;
      height: 110px;
      background: rgba(16, 185, 129, 0.25);
      border: 2px solid #10b981;
      border-radius: 8px;
      display: none;
      justify-content: center;
      align-items: center;
      color: #34d399;
      font-size: 0.85rem;
      font-weight: bold;
      z-index: 30;
      touch-action: none;
    }
    #cursor {
      position: absolute;
      font-size: 2rem;
      display: none;
      z-index: 40;
      pointer-events: none;
      transition: transform 0.05s linear;
    }
  </style>
</head>
<body>

  <div id="stage">
    <div class="header-title">Welcome To Mystery Of Silence</div>

    <!-- Hotspots for Initial Shelves -->
    <div id="shelf-left" class="shelf-hotspot"></div>
    <div id="shelf-right" class="shelf-hotspot"></div>

    <!-- Dynamic Pointer Element -->
    <div id="cursor">👆</div>

    <!-- Initial Desk Routing Buttons -->
    <div class="nav-container" id="main-nav">
      <a href="https://github.com/cateticos-rgb/Boardroom/blob/Chatroom.html/index.html" class="nav-btn">&lt; Back To Lounge &gt;</a>
      <a href="https://github.com/cateticos-rgb/Boardroom/blob/Chatroom.html/Chatroom.html" class="nav-btn">&lt; Go To Chatroom &gt;</a>
    </div>

    <!-- Riddle Drawer -->
    <div class="drawer" id="riddle-drawer">
      <div class="drawer-header">
        <span id="drawer-title">SHELF // PUZZLE</span>
        <span class="drawer-close" onclick="closeDrawer()">[ X ]</span>
      </div>
      <div class="drawer-body" id="drawer-text">Riddle text goes here...</div>
      <input type="text" id="riddle-input" class="riddle-input" placeholder="TYPE ANSWER...">
      <button class="submit-btn" onclick="submitRiddle()">COMPLETE THE BOOK</button>
    </div>

    <!-- Top Floating Card -->
    <div class="floating-card" id="floating-card">
      <div class="card-title" id="card-num">Book # 16732</div>
      <div class="card-desc" id="card-name">StarGate Manuscript</div>
      <div class="card-actions">
        <button class="card-btn" onclick="closeCard()">Close</button>
        <button class="card-btn" onclick="exploreBook()">Explore</button>
      </div>
    </div>

    <!-- Trackpad Zone for Choose Mode -->
    <div id="trackpad">
      Move to choose
    </div>
  </div>

  <script>
    let currentShelf = null;
    let isChooseMode = false;

    // Shelves / Books Database
    const riddles = {
      left: {
        title: "LEFT SHELF // ARCHITECTURE OF SILENCE",
        text: "I am written in silence, read in wonder, bound without ink. What am I?",
        answers: ["book", "silence"]
      },
      right: {
        title: "RIGHT SHELF // SYNDICATE ARCHIVES",
        text: "Nine lives, one code, unseen in the shadows. What keeps the Matrix whole?",
        answers: ["cat", "syndicate"]
      }
    };

    const bookHotspots = [
      { id: 100100, name: "Mystery of hidden path", xMin: 0, xMax: 35, yMin: 15, yMax: 35 },
      { id: 16732, name: "StarGate Manuscript", xMin: 65, xMax: 100, yMin: 15, yMax: 35 },
      { id: 40404, name: "SyndiCATe Chronicles", xMin: 0, xMax: 35, yMin: 36, yMax: 55 },
      { id: 88812, name: "Matrix Core Blueprint", xMin: 65, xMax: 100, yMin: 36, yMax: 55 },
      { id: 77001, name: "Claude Realm Tome", xMin: 35, xMax: 65, yMin: 45, yMax: 65 }
    ];

    // Open Initial Shelf Drawers
    document.getElementById('shelf-left').addEventListener('click', () => openRiddle('left'));
    document.getElementById('shelf-right').addEventListener('click', () => openRiddle('right'));

    function openRiddle(shelf) {
      if (isChooseMode) return;
      currentShelf = shelf;
      document.getElementById('drawer-title').innerText = riddles[shelf].title;
      document.getElementById('drawer-text').innerText = riddles[shelf].text;
      document.getElementById('riddle-input').value = '';
      document.getElementById('riddle-drawer').classList.add('active');
    }

    function closeDrawer() {
      document.getElementById('riddle-drawer').classList.remove('active');
    }

    function submitRiddle() {
      const input = document.getElementById('riddle-input').value.trim().toLowerCase();
      if (riddles[currentShelf].answers.includes(input)) {
        closeDrawer();
        activateChooseMode();
      } else {
        document.getElementById('drawer-text').innerText = "Access denied... Try again.";
      }
    }

    // Transition to Choose.jpg Mode
    function activateChooseMode() {
      isChooseMode = true;
      document.getElementById('stage').style.backgroundImage = "url('Choose .jpg')";
      document.getElementById('main-nav').style.display = 'none';
      document.getElementById('shelf-left').style.display = 'none';
      document.getElementById('shelf-right').style.display = 'none';
      
      const trackpad = document.getElementById('trackpad');
      const cursor = document.getElementById('cursor');
      trackpad.style.display = 'flex';
      cursor.style.display = 'block';

      // Set initial cursor center position
      updateCursorPos(window.innerWidth / 2, window.innerHeight * 0.4);
    }

    // Trackpad Pointer Movement Logic
    const trackpad = document.getElementById('trackpad');
    let cursorX = window.innerWidth / 2;
    let cursorY = window.innerHeight * 0.4;

    trackpad.addEventListener('touchmove', (e) => {
      e.preventDefault();
      const touch = e.touches[0];
      const rect = trackpad.getBoundingClientRect();
      
      // Map finger movement on pad to screen viewport coordinates
      const normX = (touch.clientX - rect.left) / rect.width;
      const normY = (touch.clientY - rect.top) / rect.height;

      cursorX = Math.min(Math.max(normX * window.innerWidth, 0), window.innerWidth);
      cursorY = Math.min(Math.max(normY * window.innerHeight * 0.7, 0), window.innerHeight * 0.7);

      updateCursorPos(cursorX, cursorY);
      checkBookCollision(cursorX, cursorY);
    });

    function updateCursorPos(x, y) {
      const cursor = document.getElementById('cursor');
      cursor.style.left = `${x}px`;
      cursor.style.top = `${y}px`;
    }

    function checkBookCollision(x, y) {
      const pctX = (x / window.innerWidth) * 100;
      const pctY = (y / window.innerHeight) * 100;

      const hitBook = bookHotspots.find(b => 
        pctX >= b.xMin && pctX <= b.xMax && pctY >= b.yMin && pctY <= b.yMax
      );

      if (hitBook) {
        showCard(hitBook.id, hitBook.name);
      }
    }

    function showCard(id, name) {
      document.getElementById('card-num').innerText = `Book # ${id}`;
      document.getElementById('card-name').innerText = name;
      document.getElementById('floating-card').classList.add('active');
    }

    function closeCard() {
      document.getElementById('floating-card').classList.remove('active');
    }

    function exploreBook() {
      alert("Unlocking SyndiCATe lore entry...");
    }
  </script>
</body>
</html>
